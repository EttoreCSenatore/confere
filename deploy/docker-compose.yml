# Implantação do Confere: API (sem porta publicada) atrás do Caddy (HTTPS automático).
# Uso: cp .env.example .env && editar && docker compose up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}   # rotação limitada: o log não cresce sem fim (e não tem dado pessoal)
    environment:
      CONFERE_CONFIAR_PROXY: "true"        # exatamente UM proxy (o Caddy) na frente
      CONFERE_LIMITE_POR_MINUTO: ${CONFERE_LIMITE_POR_MINUTO:-30}
      CONFERE_CACHE_TTL: ${CONFERE_CACHE_TTL:-600}
      CONFERE_SNAPSHOT_MAX_DIAS: ${CONFERE_SNAPSHOT_MAX_DIAS:-14}
      CONFERE_CACHE_TTL_DADOS: ${CONFERE_CACHE_TTL_DADOS:-86400}
      # CONFERE_DOCS NÃO é definido: o Swagger (que usa CDN) fica desligado em produção.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # usuário comum pode abrir 80/443 dentro do contêiner
    pids_limit: 200
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}   # rotação limitada: o log não cresce sem fim (e não tem dado pessoal)
    ports:
      - "${CONFERE_HTTP_PORT:-80}:80"
      - "${CONFERE_HTTPS_PORT:-443}:443"
    environment:
      CONFERE_DOMAIN: ${CONFERE_DOMAIN:?defina CONFERE_DOMAIN no .env}
      CONFERE_ACME_EMAIL: ${CONFERE_ACME_EMAIL:-nobody@example.invalid}
    volumes:
      - caddy_data:/caddy/data      # certificados (únicos dados persistentes; sem dado de consulta)
      - caddy_config:/caddy/config

volumes:
  caddy_data:
  caddy_config:
