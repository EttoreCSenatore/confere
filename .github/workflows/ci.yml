name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (build pt-BR e inglês)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Auditoria npm (avisos aceitos documentados no script)
        run: python3 ../scripts/auditar-npm.py .
      - name: Documentação em português e inglês (mesma estrutura)
        run: python3 ../scripts/checar-traducao.py
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm website
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  api:
    name: API (lint, testes, auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: pip-audit --skip-editable
      - name: SBOM da API (CycloneDX)
        run: pip-audit --skip-editable -f cyclonedx-json -o ../sbom-api.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-api
          path: sbom-api.cdx.json
      - name: Licenças das dependências (AGPL-3.0)
        run: python ../scripts/auditar-licencas.py --python

  cli:
    name: CLI (lint, testes, auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: pip-audit --skip-editable
      - name: Licenças das dependências (AGPL-3.0)
        run: python ../scripts/auditar-licencas.py --python --pyproject cli/pyproject.toml

  web:
    name: Web (tipos, testes, auditoria, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Auditoria npm (avisos aceitos documentados no script)
        run: python3 ../scripts/auditar-npm.py .
      - name: SBOM do app web (CycloneDX)
        run: npm sbom --omit=dev --sbom-format cyclonedx > ../sbom-web.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-web
          path: sbom-web.cdx.json
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm web
      - run: npm run build

  imagens:
    name: Imagens (build, Caddyfile, varredura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build -f deploy/Dockerfile.api -t confere-api:ci .
      - run: docker build -f deploy/Dockerfile.web -t confere-web:ci .
      - name: Regras de privacidade e segurança da implantação
        run: python3 scripts/checar-implantacao.py
      - name: Valida o compose e o Caddyfile
        working-directory: deploy
        run: |
          CONFERE_DOMAIN=ci.example.com docker compose config --quiet
          docker run --rm -e CONFERE_DOMAIN=ci.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Varredura de vulnerabilidades (Trivy; falha em CRÍTICA com correção disponível)
        run: |
          for img in api web; do
            docker save "confere-$img:ci" -o "$img.tar"
            docker run --rm -v "$PWD/$img.tar:/image.tar:ro" aquasec/trivy:0.76.2 image --input /image.tar \
              --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1
            docker run --rm -v "$PWD/$img.tar:/image.tar:ro" aquasec/trivy:0.76.2 image --input /image.tar \
              --scanners vuln --ignore-unfixed --severity HIGH --exit-code 0
          done
      - name: Segredos no repositório (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0 detect --source /repo --no-git --redact -v

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docs, api, cli, web, imagens]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
