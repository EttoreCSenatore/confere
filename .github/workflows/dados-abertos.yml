name: Dados abertos (atualização semanal)

on:
  schedule:
    - cron: "17 6 * * 1"   # segundas, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  atualizar:
    name: Atualiza as cópias locais e abre um PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e 'api[dev]'
      - name: Baixa as listas da BrasilAPI (já minimizadas) e grava as cópias
        run: python scripts/atualizar-snapshots.py
      - name: Testes (inclui a conferência das cópias reais)
        working-directory: api
        run: pytest
      - name: Abre um PR se algo mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- api/confere/snapshots; then
            echo "Sem mudanças nos dados abertos."
            exit 0
          fi
          ramo="dados-abertos/$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$ramo"
          git add api/confere/snapshots
          git commit -m "chore(dados): atualiza as cópias locais dos dados abertos"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Dados abertos: atualização semanal" \
            --body "Cópias locais regeneradas por \`scripts/atualizar-snapshots.py\` (já minimizadas, sem contato nem endereço). Os testes rodaram neste job. PRs abertos com o token do Actions não disparam a CI: feche e reabra para rodá-la. Se este passo falhar com 'not permitted to create pull requests', ligue Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'."
